<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica', sans-serif; color: #1e293b; padding: 20px; }
        .ticket-container {
            width: 600px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 30px;
            position: relative;
        }
        .event-name { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .location { color: #64748b; font-size: 14px; margin-bottom: 20px; }

        .details-grid {
            display: table;
            width: 100%;
            margin-top: 20px;
        }
        .detail-item { display: table-cell; width: 33%; }
        .label { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: bold; }
        .value { font-size: 16px; font-weight: bold; }

        .barcode-section {
            border-top: 2px dashed #e2e8f0;
            padding: 20px;
            background-color: #f8fafc;
            text-align: center;
        }
        .ticket-id { font-family: monospace; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
<div class="ticket-container">
    <div class="header">
        ADMIT ONE - OFFICIAL TICKET
    </div>
    <div class="content">
        <div class="event-name">{{eventName}}</div>
        <div class="location">📍 {{locationName}}</div>

        <div class="details-grid">
            <div class="detail-item">
                <div class="label">Date</div>
                <div class="value">{{eventDate}}</div>
            </div>
            <div class="detail-item">
                <div class="label">Time</div>
                <div class="value">{{eventTime}}</div>
            </div>
            <div class="detail-item">
                <div class="label">Seat / Section</div>
                <div class="value">General Admission</div>
            </div>
        </div>
    </div>
    <div class="barcode-section">
        <div class="ticket-id">#{{ticketNumber}}</div>
        <p>Scan this at the entrance</p>
    </div>
</div>
</body>
</html>
