<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Helvetica, sans-serif; color: #1e293b; padding: 20px; }
        .ticket-container {
            width: 600px;
            border: 2px solid #e2e8f0;
        }
        .header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .content { padding: 30px; }
        .event-name { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .location { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .label { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: bold; }
        .value { font-size: 16px; font-weight: bold; }
        .barcode-section {
            border-top: 2px dashed #e2e8f0;
            padding: 20px;
            background-color: #f8fafc;
            text-align: center;
        }
        .ticket-id { font-family: monospace; font-size: 14px; color: #1e293b; font-weight: bold; }
    </style>
</head>
<body>
<div class="ticket-container">
    <div class="header">
        ADMIT ONE - OFFICIAL TICKET
    </div>
    <div class="content">
        <div class="event-name" th:text="${eventName}">Event Name</div>
        <div class="location" th:text="${locationName}">Location Name</div>

        <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
            <tr>
                <td style="width: 33%;">
                    <div class="label">Date</div>
                    <div class="value" th:text="${#temporals.format(eventDate, 'MMM dd, yyyy')}">Date</div>
                </td>
                <td style="width: 33%;">
                    <div class="label">Time</div>
                    <div class="value" th:text="${#temporals.format(eventTime, 'HH:mm')}">Time</div>
                </td>
                <td style="width: 33%;">
                    <div class="label">Seat / Section</div>
                    <div class="value">General Admission</div>
                </td>
            </tr>
        </table>
    </div>
    <div class="barcode-section">
        <img th:src="'data:image/png;base64,' + ${qrCode}"
             style="width: 150px; height: 150px;"/>
        <div class="ticket-id">#<span th:text="${ticketNumber}">00000000</span></div>
        <p style="font-size: 12px; color: #64748b;">Scan this at the entrance</p>
    </div>
</div>
</body>
</html>
