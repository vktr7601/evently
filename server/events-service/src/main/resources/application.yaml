spring:
  data:
    redis:
      host: localhost
      port: 6379
      username: admin
      password: password123
  application:
    name: events-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: events-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/events_db
    username: admin
    password: adminPassword
  jpa:
    hibernate:
      ddl-auto: create-drop
      order_inserts: true
      order_updates: true
      jdbc:
        batch_size: 50
    defer-datasource-initialization: true
    show-sql: true
    hbm2ddl:
      import_files: data.sql
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

server:
  port: 8082
aws:
  s3:
    bucket-name: events-service-bucket
