spring:
  application:
    name: events-service
  datasource:
    url: jdbc:postgresql://localhost:5432/events_db
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:adminPassword}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      username: admin
      password: password123
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: events-service-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "events.ticket,events.user"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/events_db
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:adminPassword}
  jpa:
    hibernate:
      ddl-auto: create-drop
      order_inserts: true
      order_updates: true
      jdbc:
        batch_size: 50
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always
server:
  port: 8082
kafka:
  bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/events_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/