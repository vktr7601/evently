spring:
  data:
    redis:
          host: localhost
          port: 6379
          username: admin
          password: password123
  application:
    name: events-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/events_db
    username: admin
    password: adminPassword
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    hbm2ddl:
      import_files: data.sql
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

server:
  port: 8082
aws:
  s3:
    bucket-name: events-service-bucket
    region: us-east-1
    access-key: AKIA4HB7X5DXB45HRBQ7
    secret-key: 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

