spring:
  application:
    name: events-service
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://postgres:5432/events_db
    username: admin
    password: adminPassword
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8761/eureka/
      instance:
        prefer-ip-address: true
