  #    container_name: eureka-service
  #    ports:
  #      - "8761:8761"
  #    networks:
  #      - evently-network

  # --- KAFKA & CONDUKTOR ---
  kafka:
    image: apache/kafka:latest
    container_name: evently-message-broker
    ports:
      - "9092:9092"
