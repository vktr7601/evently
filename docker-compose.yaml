#    container_name: conduktor-console
#    ports:
#      - "8081:8080" # Changed host port to 8081 because pgAdmin is using 8080
#    environment:
#      - CDK_DATABASE_URL=postgresql://conduktor:conduktor@postgres-conductor:5432/conduktor
#      - CDK_DATABASE_PASSWORD=conduktor
#      - KAFKA_BOOTSTRAP_SERVERS=message-broker:9092
#      - CDK_ADMIN_EMAIL=admin@evently.com
