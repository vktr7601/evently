services:
  postgres:
    image: postgres:latest
    container_name: evently-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminPassword
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
#    networks:
#      - evently-network

  #  eureka:
