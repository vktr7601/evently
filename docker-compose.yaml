services:
  postgres:
    image: postgres:latest
    container_name: postgres-microservices
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  eureka:
    image: eureka
    container_name: eureka-service
    ports:
      - "8761:8761"

  api-gateway:
    image: evently-gateway
    container_name: evently-api-gateway
    restart: on-failure
    ports:
      - "9000:9000"
    depends_on:
      - eureka

  events-service:
    image: events-service
    container_name: events-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_SERVER=http://eureka:8761/eureka/
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - eureka

  front-end:
    image: react-app
    container_name: react-app-fronted
    ports:
      - "3000:3000"
    depends_on:
      - events-service

  kafka:
    image: apache/kafka
    container_name: message-broker
    ports:
      - "9092:9092"
